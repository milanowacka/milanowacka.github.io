name: Update Website Content

on:
  # Every push to main that changes the content or anything the generated
  # pages depend on. The generated HTML/views are not listed, so the commit
  # made by this workflow never triggers it again.
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'site_generator.py'
      - 'update_content.py'
      - 'style.css'
      - '.github/workflows/update-content.yml'
  # Manual run from the Actions tab ("Run workflow").
  workflow_dispatch:

permissions:
  contents: write

# Queue runs instead of racing: a second push waits for the first rebuild.
concurrency:
  group: update-content
  cancel-in-progress: false

jobs:
  update-content:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        ref: main
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Check if content file exists
      run: |
        if [ ! -f "content/page-content.md" ]; then
          echo "Error: content/page-content.md not found"
          exit 1
        fi

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: pip install Pillow

    - name: Install ffmpeg (ffprobe reads video resolution)
      run: sudo apt-get update && sudo apt-get install -y ffmpeg

    - name: Run content update script
      run: python update_content.py

    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add index.html about.html drawing.html video.html cv.html workshops.html 404.html sitemap.xml views/
        if git diff --staged --quiet; then
          echo "No changes to commit"
          exit 0
        fi
        git commit -m "Update website content [CI] [skip ci]"
        # main may have moved while the site was building: rebase onto it.
        # Generated files win any conflict, since they were just rebuilt.
        for attempt in 1 2 3; do
          git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
          echo "Push failed (attempt $attempt), retrying..."
          sleep 5
        done
        exit 1
