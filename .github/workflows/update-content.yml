name: Update Website Content

on:
  # 3am UTC daily. Only actually rebuilds if content was pushed to main
  # since the last run (see "Check for content changes" below).
  schedule:
    - cron: '0 3 * * *'
  # Manual run from the Actions tab ("Run workflow"): always rebuilds.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-content:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Check for content changes pushed to main
      id: check
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Manual run — rebuilding."
        elif git log --since="24 hours ago" --oneline -- content/ | grep -q .; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
        else
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "No content changes pushed to main since the last run — skipping rebuild."
        fi

    - name: Set up Python
      if: steps.check.outputs.changed == 'true'
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Check if content file exists
      if: steps.check.outputs.changed == 'true'
      run: |
        if [ ! -f "content/page-content.md" ]; then
          echo "Error: content/page-content.md not found"
          exit 1
        fi

    - name: Install dependencies
      if: steps.check.outputs.changed == 'true'
      run: pip install Pillow

    - name: Install ffmpeg (ffprobe reads video resolution)
      if: steps.check.outputs.changed == 'true'
      run: sudo apt-get update && sudo apt-get install -y ffmpeg

    - name: Run content update script
      if: steps.check.outputs.changed == 'true'
      run: python update_content.py

    - name: Commit and push changes
      if: steps.check.outputs.changed == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add index.html about.html drawing.html video.html cv.html workshops.html 404.html sitemap.xml views/
        if git diff --quiet && git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Update website content [CI]"
          git push
        fi