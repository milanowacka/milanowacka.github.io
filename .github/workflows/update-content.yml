name: Update Website Content

on:
  push:
    branches:
      - main
    paths:
      - 'content/**'

permissions:
  contents: write

jobs:
  update-content:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    
    - name: Check if content file exists
      run: |
        if [ ! -f "content/page-content.md" ]; then
          echo "Error: content/page-content.md not found"
          exit 1
        fi
    
    - name: Install dependencies
      run: pip install Pillow

    - name: Run content update script
      run: python update_content.py
    
    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add index.html about.html
        if git diff --quiet && git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Update website content [CI]"
          git push
        fi